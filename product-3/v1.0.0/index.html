  <script src="../../assets/js/NavController.js"></script>
  <script src="../../assets/js/ScrollObserver.js"></script>
  <script src="../../assets/js/ProductManager.js"></script>
  <script src="../../assets/js/main.js"></script>

  <script>
    const PRODUCT_ID = 'product-3';
    const CURRENT_VERSION = '1.0.0';

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof initNavigation === 'function') initNavigation();
      if (typeof initMobileMenu === 'function') initMobileMenu();

      await productManager.loadProducts();
      const product = productManager.getProductById(PRODUCT_ID);

      if (product) {
        // Update page content
        document.querySelector('.version-badge').textContent = 'v' + CURRENT_VERSION;
        document.querySelector('.product-title').textContent = product.shortName + ' v' + CURRENT_VERSION;
        
        const version = product.versions.find(v => v.version === CURRENT_VERSION);
        if (version) {
          document.querySelector('.version-info').textContent = '发布日期：' + version.releaseDate + ' | 文件大小：' + version.fileSize;
          document.querySelector('.changelog').textContent = version.changelog;
        }

        // Render other versions
        const otherVersions = product.versions.filter(v => v.version !== CURRENT_VERSION);
        const container = document.getElementById('other-versions');
        if (otherVersions.length > 0) {
          container.innerHTML = otherVersions.map(version => `
            <div class="card p-6 fade-in">
              <div class="flex items-center justify-between">
                <div><h3 class="text-lg font-semibold text-gray-900">v${version.version}</h3><p class="text-sm text-gray-600">${version.releaseDate}</p></div>
                <a href="../${product.id}/v${version.version}/download.html" class="btn btn-outline text-sm">查看下载</a>
              </div>
            </div>
          `).join('');
        }

        if (typeof scrollObserver !== 'undefined' && scrollObserver.observeAll) {
          scrollObserver.observeAll(container.querySelectorAll('.fade-in'));
        }
      }
    });
  </script>
