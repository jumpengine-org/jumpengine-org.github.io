<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品一 - 版本选择</title>
  <meta name="description" content="查看产品一的所有版本、更新历史和下载选项">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-white text-gray-900 font-sans antialiased">

  <!-- Navigation -->
  <header id="navbar" class="fixed top-0 w-full bg-white/80 backdrop-blur-sm transition-all duration-300 z-50 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="../index.html" class="text-xl font-bold text-gray-900 hover:text-blue-600 transition-colors">
          JumpEngine
        </a>

        <nav class="hidden md:flex space-x-8">
          <a href="../index.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors relative group">
            主页
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
          <a href="../products.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors relative group">
            产品
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
          <a href="../about.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors relative group">
            关于
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"></span>
          </a>
        </nav>

        <button id="mobile-menu-toggle" class="md:hidden p-2 rounded-md text-gray-600 hover:text-blue-600 hover:bg-gray-100 transition-colors" aria-label="打开菜单">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100">
      <div class="px-4 py-3 space-y-2">
        <a href="../index.html" class="block py-2 text-gray-600 hover:text-blue-600">主页</a>
        <a href="../products.html" class="block py-2 text-gray-600 hover:text-blue-600">产品</a>
        <a href="../about.html" class="block py-2 text-gray-600 hover:text-blue-600">关于</a>
      </div>
    </div>
  </header>

  <div class="h-16"></div>

  <main>
    <!-- Hero Section -->
    <section class="py-16 bg-gradient-to-b from-blue-50 to-white">
      <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto text-center fade-in">
          <h1 class="text-4xl font-bold text-gray-900 mb-4 product-name">产品一</h1>
          <p class="text-xl text-gray-600 mb-6">查看所有版本和更新历史</p>
          <a href="./index.html" class="text-blue-600 hover:text-blue-700 inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            返回产品介绍
          </a>
        </div>
      </div>
    </section>

    <!-- Version Comparison Table -->
    <section class="py-16 bg-white">
      <div class="container mx-auto px-4">
        <div class="max-w-5xl mx-auto">
          <div class="text-center mb-12 fade-in">
            <h2 class="text-3xl font-bold text-gray-900 mb-4">版本对比</h2>
            <p class="text-gray-600">选择适合您的版本进行下载</p>
          </div>

          <div class="card overflow-hidden fade-in">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">版本</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">发布日期</th>
                  <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">文件大小</th>
                  <th class="px-6 py-4 text-center text-sm font-semibold text-gray-900">操作</th>
                </tr>
              </thead>
              <tbody id="version-table-body" class="divide-y divide-gray-200">
                <!-- Dynamically rendered by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Changelog Section -->
    <section class="py-16 bg-gray-50">
      <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto">
          <div class="text-center mb-12 fade-in">
            <h2 class="text-3xl font-bold text-gray-900 mb-4">更新日志</h2>
            <p class="text-gray-600">了解每个版本的详细更新内容</p>
          </div>

          <div id="changelog-container" class="space-y-8">
            <!-- Dynamically rendered by JavaScript -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-50 py-12 border-t border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
        <div>
          <h4 class="font-semibold text-gray-900 mb-4">产品</h4>
          <ul class="space-y-2 text-sm">
            <li><a href="../products.html" class="text-gray-600 hover:text-blue-600 transition-colors">产品矩阵</a></li>
          </ul>
        </div>

        <div>
          <h4 class="font-semibold text-gray-900 mb-4">支持</h4>
          <ul class="space-y-2 text-sm">
            <li><a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">使用文档</a></li>
            <li><a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">常见问题</a></li>
            <li><a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">更新日志</a></li>
          </ul>
        </div>

        <div>
          <h4 class="font-semibold text-gray-900 mb-4">关于</h4>
          <ul class="space-y-2 text-sm">
            <li><a href="../about.html" class="text-gray-600 hover:text-blue-600 transition-colors">品牌介绍</a></li>
            <li><a href="../about.html#contact" class="text-gray-600 hover:text-blue-600 transition-colors">联系方式</a></li>
            <li><a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">加入我们</a></li>
          </ul>
        </div>
      </div>

      <div class="pt-8 border-t border-gray-200 text-center">
        <p class="text-sm text-gray-500">&copy; 2026 JumpEngine. 保留所有权利。</p>
        <p class="text-xs text-gray-400 mt-2">MIT License · 开源免费</p>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="../assets/js/NavController.js"></script>
  <script src="../assets/js/ScrollObserver.js"></script>
  <script src="../assets/js/ProductManager.js"></script>
  <script src="../assets/js/main.js"></script>

  <script>
    const PRODUCT_ID = 'product-1';

    document.addEventListener('DOMContentLoaded', async () => {
      // Initialize navigation
      if (typeof initNavigation === 'function') initNavigation();
      if (typeof initMobileMenu === 'function') initMobileMenu();

      // Load product data
      await productManager.loadProducts();
      const product = productManager.getProductById(PRODUCT_ID);

      if (product) {
        // Update page title
        document.querySelector('.product-name').textContent = product.name;

        // Render version comparison table
        const tableBody = document.getElementById('version-table-body');
        if (product.versions && product.versions.length > 0) {
          tableBody.innerHTML = product.versions.map((version, index) => `
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-semibold text-gray-900">v${version.version}</span>
                  ${index === 0 ? '<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs font-medium">最新</span>' : ''}
                </div>
              </td>
              <td class="px-6 py-4 text-sm text-gray-600">${version.releaseDate}</td>
              <td class="px-6 py-4 text-sm text-gray-600">${version.fileSize}</td>
              <td class="px-6 py-4 text-center">
                <a href="./v${version.version}/download.html" class="btn btn-primary text-sm px-4 py-2 inline-flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                  </svg>
                  下载此版本
                </a>
              </td>
            </tr>
          `).join('');
        } else {
          tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">暂无可用版本</td></tr>';
        }

        // Render changelog sections
        const changelogContainer = document.getElementById('changelog-container');
        if (product.versions && product.versions.length > 0) {
          changelogContainer.innerHTML = product.versions.map((version, index) => `
            <div class="card p-8 fade-in" style="--delay: ${index * 100}ms;">
              <div class="flex items-start justify-between mb-6">
                <div>
                  <div class="flex items-center gap-3 mb-2">
                    <h3 class="text-2xl font-bold text-gray-900">v${version.version}</h3>
                    ${index === 0 ? '<span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg text-sm font-medium">最新版本</span>' : ''}
                  </div>
                  <p class="text-sm text-gray-500">发布日期：${version.releaseDate} | 文件大小：${version.fileSize}</p>
                </div>
                <a href="./v${version.version}/download.html" class="btn btn-outline text-sm px-4 py-2">
                  下载此版本
                </a>
              </div>

              <div class="prose max-w-none">
                <div class="text-gray-700 whitespace-pre-line">${version.changelog}</div>
              </div>

              <div class="mt-6 pt-6 border-t border-gray-200">
                <a href="./v${version.version}/" class="text-blue-600 hover:text-blue-700 text-sm font-medium inline-flex items-center gap-2">
                  查看使用说明文档
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                  </svg>
                </a>
              </div>
            </div>
          `).join('');
        } else {
          changelogContainer.innerHTML = '<p class="text-center text-gray-500 py-8">暂无更新日志</p>';
        }

        // Re-initialize scroll observer
        if (typeof scrollObserver !== 'undefined' && scrollObserver.observeAll) {
          scrollObserver.observeAll(document.querySelectorAll('.fade-in'));
        }
      }
    });
  </script>
</body>
</html>
